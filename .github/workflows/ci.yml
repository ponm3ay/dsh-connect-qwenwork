name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The plugin's own tests need no runtime, so this matrix is about the
        # module and WASM behaviour rather than about DSH itself.
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Unit tests
        run: node --test --test-timeout=30000 "test/*.test.mjs"
      - name: Browser-half contract
        run: node scripts/client.mjs

  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # A broken manifest or patch is the one failure that makes the plugin
      # uninstallable rather than merely wrong, so it gets its own check.
      - name: Validate package.json and the bundle patch
        run: node scripts/validate-manifest.mjs
